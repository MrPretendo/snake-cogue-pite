<title>Snake Cogue Pite</title>

<!--
  Página del artifact. Es sólo una PIEL: el marcado lo arma host/boot.mjs y el
  juego entero vive en src/, intacto. host/shell.css es la otra piel (la de
  desarrollo local); no se cargan las dos a la vez, para no pelear en la cascada.

  Plan de diseño
  - Color   : la paleta es la del propio juego, no una nueva. Fondo #05070D,
              bisel #0A0F1A, filo cian #00E5FF, texto #E8EEF7, apagado #5B6B84.
              Los neutros son pizarra (sesgados a azul, hacia el cian).
  - Tipo    : Chakra Petch para el bisel (angular, de consola) y Saira para la
              interfaz — Saira entra por el token --font del shim, así que el HUD
              del juego se ve igual en toda máquina en vez de caer en Segoe UI.
  - Trazado : un mueble. Barra de bisel de 38px con icono y nombre a la
              izquierda y la placa de la máquina a la derecha; el juego ocupa
              todo lo demás.
  - Un solo tema, a propósito: el juego es una pantalla de arcade de neón sobre
    #060A14 pintado en el canvas. Una paleta clara lo rompería. Por eso no hay
    media query de tema y cada color se pinta explícito, para que la página se
    sostenga sobre cualquier fondo del anfitrión.
-->

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Saira:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="src/app.css">

<style>
  :root {
    --suelo: #05070D;
    --bisel: #0A0F1A;
    --filo: #16233A;
    --texto: #E8EEF7;
    --apagado: #5B6B84;
    --cian: #00E5FF;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--suelo);
    color: var(--texto);
    overscroll-behavior: none;
  }

  .sh-win {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-rows: 38px 1fr;
    min-height: 0;
    background: var(--suelo);
  }

  .sh-title {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    min-width: 0;
    background: var(--bisel);
    border-bottom: 1px solid var(--filo);
    box-shadow: inset 0 -1px 0 0 rgba(0, 229, 255, 0.09);
  }

  .sh-title__icon {
    width: 18px;
    height: 18px;
    flex: none;
  }

  .sh-title__text {
    font-family: "Chakra Petch", "Saira", system-ui, sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.04em;
    color: var(--texto);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* La placa de la máquina: os_name y os_version reales del PC del juego. */
  .sh-title__badge {
    margin-left: auto;
    flex: none;
    font-family: "Chakra Petch", monospace;
    font-weight: 500;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--apagado);
    padding: 3px 9px;
    border: 1px solid var(--filo);
    border-radius: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }

  .sh-body {
    position: relative;
    min-height: 0;
    overflow: hidden;
  }

  /* El escenario: tamano logico fijo (lo declara el juego en RESOLUCION) que
     boot.mjs escala para encajar en .sh-body. La especificidad extra gana a
     `.sr-app { position: relative }` de src/app.css. */
  .sh-body > .sh-stage {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 0;
  }

  /* Foco de teclado visible: el botón de reinicio del juego no traía ninguno. */
  .sh-body :focus-visible {
    outline: 2px solid var(--cian);
    outline-offset: 2px;
  }

  /* En pantallas estrechas el escenario se escala solo; el marco cede la placa. */
  @media (max-width: 760px) {
    .sh-title__badge { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sh-body .sr-card,
    .sh-body .sr-btn-restart {
      transition: none;
    }
  }
</style>

<script type="module" src="host/boot.mjs"></script>
